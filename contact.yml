openapi: 3.0.2
servers:
  - url: /v3
info:
  version: 1.0.0
  title: Contacts schema
components:
  schemas:
    ValidationError:
      type: object
      required:
        - field
        - reason
      properties:
        field:
          type: string
        reason:
          type: string
    Errors:
      type: object
      required:
        - errors
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"
    Contact:
      type: object
      required:
        - first_name
        - last_name
        - birthday
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        first_name:
          type: string
          minLength: 1
          maxLength: 255
        middle_name:
          type: string
          maxLength: 255
        last_name:
          type: string
          minLength: 1
          maxLength: 255
        birthday:
          type: string
          format: date
        description:
          type: string
          maxLength: 255
